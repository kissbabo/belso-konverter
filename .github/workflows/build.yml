name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Python 3.11 beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fuggosegek telepitese
        run: |
          pip install pyinstaller openpyxl xlrd tkinterdnd2

      - name: EXE buildelese
        run: |
          pyinstaller --onefile --windowed --name BELSO_Konverter --hidden-import openpyxl --hidden-import xlrd --hidden-import tkinterdnd2 BELSO_Konverter.py

      - name: EXE feltoltese
        uses: actions/upload-artifact@v4
        with:
          name: BELSO_Konverter_Windows
          path: dist/BELSO_Konverter.exe
          retention-days: 30
